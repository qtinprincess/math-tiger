<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🐯 數學老虎追追追</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style type="text/tailwindcss">
@layer components{
.btn{@apply rounded-xl px-4 py-2.5 text-lg font-bold text-white shadow active:scale-95 transition select-none whitespace-nowrap}
}
</style>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#f6f3ee;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#2f2a25;margin:0}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop{animation:pop .5s}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#toast{animation:drop .3s;white-space:pre-line}
.nm{text-decoration:underline;text-decoration-color:#f97316;text-decoration-thickness:3px;text-underline-offset:.12em}
.nm .zc{border-bottom:3px solid #f97316}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
.shake{animation:shake .6s}
@keyframes fl{0%{opacity:.55}100%{opacity:0}}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(540deg);opacity:.9}}
#conf span{position:fixed;top:0;animation:fall linear forwards;z-index:70;pointer-events:none}
#flash{position:fixed;inset:0;background:#ef4444;opacity:0;pointer-events:none;z-index:45}
#flash.on{animation:fl .9s}
.zc{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .03em}
.zy{display:inline-flex;align-items:center;font-size:.4em;line-height:1;margin-left:.08em;font-weight:700;color:#c2410c}
.zy b{writing-mode:vertical-rl;text-orientation:upright;font-weight:700;letter-spacing:-.08em}
.zy i{font-style:normal;margin-left:.04em}
.zy.n{flex-direction:column}.zy.n i{margin:0 0 .1em 0}

html,body{height:100%}
#app{display:flex;flex-direction:column;min-height:100dvh}
#main{flex:1;min-height:0;display:grid;gap:10px;padding:8px 10px 10px;grid-template-columns:minmax(0,1fr)}
.card{background:#fff;border:1px solid #e7e2da;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:10px}
.tb{border:1px solid #d6d0c7;background:#fff;color:#44403c;border-radius:10px;padding:4px 10px;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer}
.tb:active{transform:scale(.96)}
.tb-dark{background:#292524;color:#fff;border-color:#292524}
.tl{border:1px solid #d6d0c7;background:#faf8f4;color:#292524;border-radius:12px;padding:10px 8px;font-size:15px;font-weight:700;text-align:center;cursor:pointer}
.tl:active{transform:scale(.97)}
.act{flex:1;border-radius:12px;padding:10px 12px;font-size:18px;font-weight:800;color:#fff;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.15);cursor:pointer}
.act:active{transform:scale(.97)}
#boardCard{display:flex;flex-direction:column;min-height:0}
#boardWrap{height:56vh;flex:none;container-type:size;display:flex;align-items:center;justify-content:center;min-height:0}
#qcard{display:flex;flex-direction:column;min-height:0;gap:8px}
#qbody{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
#qtext{font-weight:800;text-align:center;font-size:clamp(1.25rem,2.3vw,2.4rem);padding:10px 8px;background:#faf8f4;border-radius:12px;display:flex;align-items:center;justify-content:center;text-wrap:balance}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#actbar{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;background:#fff;padding-top:8px;border-top:1px solid #eee}
@media (min-width:900px) and (min-height:520px){
  body{overflow:hidden}
  #app{height:100dvh;min-height:0}
  #main{grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  #boardWrap{height:auto;flex:1}
}
</style>
</head>
<body>
<div id="flash"></div>
<div id="app">
  <header class="flex items-center gap-2 px-3 py-2 bg-white border-b border-stone-200 flex-wrap">
    <div class="flex items-baseline gap-2 shrink-0"><h1 class="text-xl md:text-2xl font-black text-orange-600 whitespace-nowrap">🐯 數學老虎追追追</h1><span class="text-xs text-stone-400">版本 1016.4</span></div>
    <div class="flex items-center gap-1.5 flex-wrap ml-auto justify-end">
      <button onclick="sfx('click');openSetup()" class="tb">🏠 首頁</button>
      <button onclick="openRules()" class="tb">📖 規則</button>
      <button id="bSnd" onclick="tgl('sound')" class="tb">🔊 音效開</button>
      <button id="bSpk" onclick="tgl('speak')" class="tb">🗣️ 朗讀開</button>
      <button id="bMc" onclick="tglMc()" class="tb">🔘 選擇題：開</button>
      <button id="bZh" onclick="tglZh()" class="tb">ㄅ 注音：開</button>
      <button id="bTools" onclick="toggleTools()" class="tb tb-dark">⚙️ 更多工具</button>
    </div>
  </header>

  <div id="main">
    <section id="boardCard" class="card">
      <div class="text-sm font-bold text-stone-500 px-1 pb-1">🏁 順時針前進，比老虎先到終點就贏！</div>
      <div id="boardWrap"><div id="board"></div></div>
    </section>

    <section id="qcard" class="card">
      <div class="flex items-center gap-1.5 flex-wrap">
        <select id="qmode" onchange="pool=[];sfx('click')" class="rounded-lg border border-stone-300 bg-white px-2 py-1 text-sm font-bold max-w-[210px]"><optgroup label="📚 題庫（老師整理好的題目）"><option value="bank">題庫・全部單元</option><option value="bank:第一單元 200以內的數">題庫・第一單元 200以內的數</option><option value="bank:第二單元 二位數的直式加減">題庫・第二單元 二位數的直式加減</option><option value="bank:第三單元 量長度">題庫・第三單元 量長度</option><option value="bank:第四單元 加減關係與應用">題庫・第四單元 加減關係與應用</option><option value="bank:第五單元 面積的大小比較">題庫・第五單元 面積的大小比較</option><option value="bank:學習加油站（一）">題庫・學習加油站（一）</option></optgroup><optgroup label="♾️ 自動出題（電腦隨機產生，永遠出不完）"><option value="mix">自動・混合</option><option value="place">自動・數與位值</option><option value="money">自動・錢幣</option><option value="cmp">自動・比大小</option><option value="add">自動・直式加法</option><option value="sub">自動・直式減法</option><option value="len">自動・量長度</option><option value="rel">自動・加減關係</option><option value="word">自動・應用題</option><option value="area">自動・面積比較</option><option value="unk">自動・加減數未知應用題</option><option value="chk">自動・驗算</option></optgroup></select>
        <button onclick="helpQ()" class="tb" title="出題方式說明">❓</button>
        <span id="timer" class="text-2xl font-black min-w-[4ch] text-center"></span>
        <div class="ml-auto flex gap-1.5">
          <button onclick="readQ()" class="tb">🔊 朗讀</button>
          <button onclick="readOpts()" class="tb">🔠 念選項</button>
          <button onclick="tglAns()" class="tb">👀 看答案</button>
        </div>
      </div>
      <div id="qmeta" class="text-xs text-stone-500 min-h-[1rem] px-1"></div>
      <div id="qbody">
        <div id="qtext">按「🎲 出題」開始！</div>
        <div id="qans" class="text-center text-xl font-black text-green-600 min-h-[1.5rem]"></div>
        <div id="opts"></div>
      </div>
      <div>
        <div class="flex items-center gap-2 mb-1">
          <div id="turnBar" class="text-lg md:text-xl font-black text-orange-600 flex-1 min-w-0"></div>
          <button onclick="selAll()" class="tb">全選</button><button onclick="selNone()" class="tb">清除</button>
        </div>
        <div id="picks" class="flex flex-wrap gap-1.5 max-h-[5.2rem] overflow-auto"></div>
      </div>
      <div id="actbar">
        <label class="flex items-center gap-1 text-sm font-bold cursor-pointer whitespace-nowrap"><input type="checkbox" id="hardChk" class="w-5 h-5"> 🌟 難題 +2</label>
        <button onclick="randQ()" class="act" style="background:#4f46e5">🎲 出題</button>
        <button onclick="okClick()" class="act" style="background:#16a34a">✅ 答對</button>
        <button onclick="answer('bad')" class="act" style="background:#e11d48">❌ 答錯</button>
      </div>
    </section>
  </div>
</div>

<div id="tools" class="hidden fixed z-50 right-3 top-12 w-[min(92vw,380px)] max-h-[85vh] overflow-auto bg-white rounded-2xl shadow-2xl border border-stone-200 p-3">
  <div class="grid grid-cols-2 gap-2">
    <button onclick="toolDo(undo)" class="tl">↩️ 返回上一步</button>
    <button onclick="toolDo(skipTurn)" class="tl">⏭️ 換下一位</button>
    <button onclick="toolDo(()=>answer('hard'))" class="tl">🌟 難題答對 +2</button>
    <button onclick="toolDo(buzzer)" class="tl">⚡ 搶答模式</button>
    <button onclick="toolDo(()=>tigerManual(1))" class="tl">🐯 老虎前進 1 格</button>
    <button onclick="toolDo(()=>tigerManual(-1))" class="tl">🐯 老虎後退 1 格</button>
    <button onclick="toolDo(openPick)" class="tl">📋 選擇題目</button>
    <button onclick="toolDo(()=>{editIdx=-1;pendingImg=null;openBank()})" class="tl">📚 題庫管理</button>
    <button id="bRot" onclick="tglRot()" class="tl">🔁 輪流：開</button>
    <button onclick="toolDo(resetGame)" class="tl">🔄 重新開始</button>
  </div>
  <div class="mt-3 pt-2 border-t border-stone-200 space-y-2 text-sm font-bold">
    <div class="flex items-center gap-2 flex-wrap"><label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="tmChk" class="w-5 h-5" onchange="tmChange()"> ⏱️ 60 秒倒數</label><select id="tmMode" class="rounded-lg border border-stone-300 bg-white px-2 py-1"><option value="warn">時間到：只提醒</option><option value="bad">時間到：自動算答錯</option></select></div>
    <div class="flex items-center gap-2 flex-wrap"><select id="mSel" onchange="setMusic(this.value)" class="rounded-lg border border-stone-300 bg-white px-2 py-1"><option value="off">🎵 音樂：關</option><option value="auto">🎵 自動（輕快→刺激）</option><option value="happy">🎵 輕快</option><option value="adv">🎵 冒險</option><option value="chase">🎵 刺激追逐</option></select><input type="range" id="mVol" min="0" max="100" value="50" oninput="setMVol(this.value)" class="w-24" title="音樂音量"></div>
    <div class="flex items-center gap-2"><span>🗣️ 聲音</span><select id="vSel" onchange="setVoice(this.value)" class="rounded-lg border border-stone-300 bg-white px-2 py-1 max-w-[220px]"></select></div>
  </div>
</div>
<div id="wrongInfo" class="hidden"></div>

<div id="toast" class="hidden fixed top-14 left-1/2 -translate-x-1/2 z-50 max-w-[92vw] bg-white border-2 border-orange-300 rounded-2xl shadow-2xl px-5 py-3 text-lg md:text-2xl font-bold text-center"></div>
<div id="avPop" class="hidden fixed inset-0 z-[60] bg-black/50 flex items-center justify-center p-4" onclick="if(event.target===this)closeAv()"><div id="avGrid" class="bg-white rounded-3xl p-4 grid grid-cols-5 gap-2 shadow-2xl max-w-full"></div></div>

let ac;
function tone(f,d=.15,t='sine',at=0,v=.2,f2){
  if(!sound)return;
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+at;
    o.type=t;o.frequency.setValueAtTime(f,s);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);
    g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);
    o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d+.02);
  }catch(e){}
}
function noise(d=.3,at=0,v=.2,f=1000,type='lowpass'){
  if(!sound)return;
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const n=Math.floor(ac.sampleRate*d),buf=ac.createBuffer(1,n,ac.sampleRate),a=buf.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
    const src=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain(),t=ac.currentTime+at;
    src.buffer=buf;fl.type=type;fl.frequency.value=f;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    src.connect(fl);fl.connect(g);g.connect(ac.destination);src.start(t);
  }catch(e){}
}

function tigerAdvance(msgs,n=1){
  let hit=false,safe=false,mv=0;const hm=[];
  for(let i=0;i<n&&tiger<END;i++){
    tiger++;mv++;
    S.forEach(s=>{
      if(s.pos===tiger&&s.pos<END){
        if(s.shields>0){s.shields--;safe=true;hm.push(`${s.av}${s.name} ${nxt('safe',SAFE)} 🛡️`)}
        else{s.pos=Math.max(1,s.pos-1);hit=true;hm.push(`‼${nxt('hit',HIT)} ${s.av}${s.name} 退後 1 步 😱`)}
      }
    });
  }
  if(mv>1)msgs.push(`‼🐯 老虎衝刺 ${mv} 格！`);
  else if(!hit&&!safe)msgs.push(`‼🐯 ${nxt('warn',WARN)}`);
  hm.forEach(x=>msgs.push(x));
  sfx('danger');setTimeout(()=>sfx('growl'),300);
  if(hit){setTimeout(()=>sfx('roar'),500);setTimeout(()=>sfx('scream'),800);alarmFx()}
  else if(safe)setTimeout(()=>sfx('shield'),700);
  else setTimeout(()=>sfx('thump'),700);
}

function nextTurn(msgs){
  for(let i=0;i<S.length;i++){
    turn=(turn+1)%S.length;turnN=0;
    if(S[turn].skip>0){S[turn].skip--;msgs.push(`⏸️ ${S[turn].av}${S[turn].name} 暫停一次，跳過`);continue}

function answer(kind){
  if(over)return toast('遊戲已結束，請按「🔄 重新開始」或「↩️ 返回上一步」');
  let P=S.filter((_,i)=>sel.has(i));
  if(!P.length){sfx('bad');return toast('請先勾選答題的小朋友 ☝️')}
  snap();judged=true;stopTimer();
  const msgs=[],cards=[],fr=P.filter(s=>s.skip>0);
  fr.forEach(s=>{s.skip--;msgs.push(`⏸️ ${s.av}${s.name} 暫停中，這次休息一次`)});
  P=P.filter(s=>!fr.includes(s));
  if(!P.length){sel.clear();if(rot)sel.add(turn);render();return toast(msgs.join('\n'))}
  const wasTurn=P.length===1&&S.indexOf(P[0])===turn,names=P.map(s=>s.name).join('、');
  qCount++;
  if(kind==='bad'){
    sfx('bad');P.forEach(s=>s.streak=0);wrong++;
    msgs.push(`${cheer('bad',P)} 💪（${names}）`);
    if(CFG.wrong==='old'){if(wrong%2===0)tigerAdvance(msgs)}else tigerAdvance(msgs,+CFG.wrong);
  }else{
    let hurt=false,sh=false;const mv=[];
    P.forEach(s=>{
      const old=s.pos;let step=kind==='hard'?2:1,dr='';
      if(CFG.dice){step=kind==='hard'?R(2,4):R(1,3);dr=`🎲擲出 ${step} 點，`}
      s.stars++;s.streak++;
      if(s.streak%3===0){s.shields++;sh=true;msgs.push(`${s.av}${s.name} 連對 3 題，獲得護盾🛡️`)}
      if(bonus>0&&s.stars%5===0){step+=bonus;msgs.push(`${s.av}${s.name} 集滿 5 顆星，加速前進 ${bonus} 步！🌟`)}
      s.pos=Math.min(END,s.pos+step);
      mv.push(`${s.name} ${dr}前進 ${step} 步`);
      if(tiger>0&&old<=tiger&&s.pos>=tiger)hurt=true;
      if(s.pos<END&&CFG.cards){const t=specAt(s.pos);if(t){cards.push({s,type:t});msgs.push(`${s.av}${s.name} 踩到${t==='fate'?'🎴命運':'🎁機會'}格！`)}}
    });
    msgs.unshift(`${cheer(kind==='hard'?'hard':'ok',P)} ${mv.join('，')} ${kind==='hard'?'🌟':'✅'}`);
    sfx(kind==='hard'?'hard':'ok');
    if(sh)setTimeout(()=>sfx('shield'),700);
    if(hurt){
      if(CFG.retreat){tiger=Math.max(0,tiger-1);msgs.push('‼🐯 嗷嗚！好痛！老虎被追上，退後 1 步～');setTimeout(()=>sfx('hurt'),900)}
      else msgs.push('💨 超越老虎，把牠甩在後面！');
    }
  }
  const shown=[];
  cards.forEach(({s,type})=>{if(s.pos>=END)return;const c=nxt(type,DECK[type]);c.fx(s,msgs);shown.push({s,c,type})});
  if(CFG.patrol!=='off'){const per=Math.max(2,CFG.patrol==='half'?Math.ceil(S.length/2):CFG.patrol==='mid'?Math.ceil(S.length*0.75):S.length);if(qCount%per===0)tigerAdvance(msgs)}
  if(rot&&wasTurn){
    turnN++;const cu=S[turn];let stay=kind!=='bad'&&turnN<2,extra=false;
    if(cu.extra){cu.extra=0;stay=true;extra=true;turnN=0}
    if(stay&&cu.skip>0){stay=false;extra=false;cu.skip=0;msgs.push(`⏸️ ${cu.av}${cu.name} 暫停一次，沒有第二次機會`)}
    if(stay)msgs.push(extra?`${cu.av}${cu.name} 抽到再來一次，再答一題！`:`${cu.av}${cu.name} 答對了，再答一題，加油！`);
    else nextTurn(msgs);
  }
  sel.clear();if(rot)sel.add(turn);render();
  const w=S.filter(s=>s.pos>=END);
  if(w.length){over=true;render();setTimeout(()=>win(w),1400);return}

}

function fireworks(ms){
  const cv=document.createElement('canvas');
  cv.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;z-index:65;pointer-events:none';
  cv.id='fwc';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);
  const x=cv.getContext('2d'),cols=['#ff4d4d','#ffd43b','#51cf66','#339af0','#f06595','#ff922b','#cc5de8'],end=Date.now()+ms;
  let ps=[],rk=[],last=0;
  function launch(){
    rk.push({x:cv.width*(.12+Math.random()*.76),y:cv.height,vy:-cv.height*(.011+Math.random()*.004),ty:cv.height*(.15+Math.random()*.3),c:cols[Math.floor(Math.random()*cols.length)]});
    tone(500,.5,'sine',0,.05,1500);
  }
  function boom(r){
    for(let i=0;i<70;i++){const a=Math.PI*2*i/70,sp=2+Math.random()*5;ps.push({x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,c:Math.random()<.3?'#ffffff':r.c})}
    SFX.boom();SFX.crackle();
  }
  function frame(t){
    if(Date.now()>end&&!ps.length&&!rk.length){cv.remove();return}
    x.clearRect(0,0,cv.width,cv.height);
    if(Date.now()<end&&t-last>420){launch();last=t}
    rk.forEach(r=>{r.y+=r.vy;x.fillStyle=r.c;x.beginPath();x.arc(r.x,r.y,3,0,7);x.fill();if(r.y<=r.ty){r.dead=1;boom(r)}});
    rk=rk.filter(r=>!r.dead);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.l-=.012;x.globalAlpha=Math.max(p.l,0);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,2.8,0,7);x.fill()});
    x.globalAlpha=1;ps=ps.filter(p=>p.l>0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

  let h=`<div class="text-3xl font-black mb-3">${first?'🐯 歡迎來到數學老虎追追追！':'🏠 首頁設定（人數・賽道長度・姓名・頭像）'}</div><div class="font-bold text-lg mb-1">參加人數：</div><div class="flex flex-wrap gap-2 mb-3">`;
  for(let k=2;k<=8;k++)h+=`<button onclick="setN(${k})" class="w-14 h-14 rounded-2xl text-2xl font-black ${k===n?'bg-orange-500 text-white':'bg-gray-100'}">${k}</button>`;
  h+=`</div><div class="font-bold text-lg mb-1">賽道長度（越長題目越多）：</div><div class="flex flex-wrap gap-2 mb-1">${[15,25,35,45].map(L=>`<button onclick="setLen(${L})" class="px-4 py-2 rounded-2xl font-black text-lg leading-tight ${L===len?'bg-orange-500 text-white':'bg-gray-100'}">${L} 格<br><span class="text-sm font-bold">最快約 ${Math.ceil((L-1)/(5+bonus)*5)} 題<br>${n} 人全班約 ${Math.ceil(Math.ceil((L-1)/(5+bonus)*5)*n/1.25)} 題</span></button>`).join('')}</div><div class="text-sm text-gray-500 mb-3">「最快」是指只有一位小朋友一直答、每題都答對。全班輪流上場時，看「全班約」才是整場大概要出的題數（答錯、抽到暫停會再多一些；擲骰子會少一些）。</div><div class="font-bold text-lg mb-1">⭐ 累積集滿 5 顆星的獎勵（星星是整場累計，不用連續答對）：</div><div class="flex flex-wrap gap-2 mb-3">${[[2,'多走 2 步（原規則）'],[1,'多走 1 步'],[0,'不加速']].map(([b,t])=>`<button onclick="setBonus(${b})" class="px-4 py-2 rounded-2xl font-black text-lg ${b===bonus?'bg-orange-500 text-white':'bg-gray-100'}">${t}</button>`).join('')}</div>${grp('🐯 只要有人答錯一題，老虎前進幾格？','wrong',[['5','5 格（衝刺）'],['3','3 格'],['2','2 格'],['1','1 格'],['old','每錯 2 題前進 1 格（舊規則）']])}${grp('🐯 老虎巡邏（每隔一段時間，老虎自己往前追）','patrol',[['round','每一輪 +1 步（輕鬆）'],['mid','每 3/4 輪 +1 步（適中・建議）'],['half','每半輪 +1 步（極限）'],['off','不巡邏']])}${grp('🐯 被小朋友追上或超過時','retreat',[['false','老虎不退後（刺激）'],['true','老虎退後 1 步']])}${grp('🎲 答對怎麼走','dice',[['false','固定走 1 步'],['true','擲骰子走 1～3 步']])}${grp('🎴 命運／機會格（踩到會抽卡：暫停、衝刺、護盾⋯）','cards',[['true','開（有驚喜）'],['false','關']])}<div class="font-bold text-lg mb-1">姓名、頭像（點頭像會跳出所有圖案）、性別（點一下切換）：</div><div class="grid sm:grid-cols-2 gap-2">`;
  for(let i=0;i<n;i++)h+=`<div class="flex items-center gap-2"><button onclick="openAv(${i})" id="av${i}" class="text-4xl w-16 h-16 rounded-2xl bg-yellow-100 border-4 border-yellow-300">${D[i].av}</button><div class="flex-1 min-w-0 flex flex-col gap-1"><input value="${esc(D[i].name)}" oninput="D[${i}].name=this.value" class="min-w-0 border-4 border-sky-200 rounded-2xl px-3 py-2 text-xl font-bold" maxlength="8"><input value="${esc(D[i].say||'')}" oninput="D[${i}].say=this.value" placeholder="🔊 唸法（選填，例如：墨潾）" class="min-w-0 border-2 border-violet-200 rounded-xl px-2 py-1 text-sm font-bold"></div><button onclick="cg(${i})" id="g${i}" class="shrink-0 w-24 h-16 rounded-2xl bg-white border-4 border-sky-200 text-base font-black">${gl(D[i].g)}</button></div>`;
  h+=`</div>${first?'':'<div class="text-center text-sm text-rose-600 font-bold mt-3">只改姓名、頭像、性別、唸法：按「💾 儲存並繼續遊戲」，進度不會歸零。要改人數或賽道長度，才需要「套用並重新開始」（進度會歸零）。</div>'}<div class="text-center mt-3 flex flex-wrap justify-center gap-2">${first?'':'<button onclick="applyKeep()" class="btn bg-sky-500">💾 儲存並繼續遊戲</button><button onclick="cancelSetup()" class="btn bg-gray-500">✖ 取消</button>'}<button onclick="startGame()" class="btn bg-green-500">🚀 ${first?'開始遊戲':'套用並重新開始'}</button></div>`;
  openM(h);
}
const grp=(t,k,o)=>`<div class="font-bold text-lg mb-1">${t}</div><div class="flex flex-wrap gap-2 mb-3">${o.map(([v,l])=>`<button onclick="setCfg('${k}','${v}')" class="px-3 py-2 rounded-2xl font-black text-base ${String(CFG[k])===String(v)?'bg-orange-500 text-white':'bg-gray-100'}">${l}</button>`).join('')}</div>`;
function setCfg(k,v){CFG[k]=v==='true'?true:v==='false'?false:v;sfx('click');openSetup()}
let setupBak=null;
const saveSet=()=>{try{localStorage.setItem('mtc_d',JSON.stringify({D,n,len,bonus,cfg:CFG}))}catch(e){}};
function applyKeep(){
  if(n!==S.length||len!==END)return toast('你改了人數或賽道長度，這兩項需要按「套用並重新開始」才會生效。只想改姓名的話，請先把人數和賽道長度改回原本的。',false);
  S.forEach((x,i)=>{const d=D[i];x.name=d.name||'小朋友';x.av=d.av;x.g=d.g||'';x.say=(d.say||'').trim()||(d.name||'').replace(/沫/g,'墨')});
  setupBak=null;saveSet();closeM();render();toast('✅ 已更新，繼續遊戲！',false);
}
function cancelSetup(){
  if(setupBak){const b=JSON.parse(setupBak);D=b.D;n=b.n;len=b.len;bonus=b.bonus;CFG=b.CFG;setupBak=null}
  closeM();
}
function setBonus(b){bonus=b;sfx('click');openSetup()}
function setLen(L){len=L;sfx('click');openSetup()}
const gl=g=>g==='m'?'👦 男':g==='f'?'👧 女':'⚪ 不分';
function cg(i){D[i].g={'':'m',m:'f',f:''}[D[i].g||''];$('g'+i).textContent=gl(D[i].g);sfx('click')}
function setN(k){n=k;sfx('click');openSetup()}
let avIdx=0;
function openAv(i){
  avIdx=i;const used=new Set(D.slice(0,n).filter((_,j)=>j!==i).map(d=>d.av));
  $('avGrid').innerHTML=AV.map(a=>`<button ${used.has(a)?'disabled':''} onclick="setAv('${a}')" class="text-4xl md:text-5xl w-16 h-16 md:w-20 md:h-20 rounded-2xl border-4 ${a===D[i].av?'border-orange-500 bg-yellow-100':'border-gray-200'} ${used.has(a)?'opacity-25':''}">${a}</button>`).join('');
  $('avPop').classList.remove('hidden');sfx('click');
}
function setAv(a){D[avIdx].av=a;$('av'+avIdx).textContent=a;closeAv();sfx('click')}
function closeAv(){$('avPop').classList.add('hidden')}
function cyc(i){
  const used=new Set(D.slice(0,n).filter((_,j)=>j!==i).map(d=>d.av));
  let k=AV.indexOf(D[i].av);do{k=(k+1)%AV.length}while(used.has(AV[k]));
  D[i].av=AV[k];$('av'+i).textContent=D[i].av;sfx('click');
}
function fixAv(){
  const u=new Set();
  D.slice(0,n).forEach(d=>{if(u.has(d.av))d.av=AV.find(a=>!D.slice(0,n).some(x=>x.av===a));u.add(d.av)});
}
function startGame(){try{localStorage.setItem('mtc_d',JSON.stringify({D,n,len,bonus,cfg:CFG}))}catch(e){}setupBak=null;initGame();closeM();musicStart();sfx('ok');toast(`🐯 老虎來了！${n} 位小朋友加油！`)}
function openBank(){
  if(editIdx>=bank.length){editIdx=-1;pendingImg=null}
  let h=`<div class="text-3xl font-black mb-3">📚 題庫管理（共 ${bank.length} 題）</div>
  <div class="grid gap-2 mb-3 bg-fuchsia-50 rounded-2xl p-3"><div class="font-black text-lg">⚡ 一鍵補題（中場休息用）</div>
    <div class="flex flex-wrap gap-2"><button onclick="genAdd(20)" class="btn bg-fuchsia-500 !py-2 !text-lg">🎁 自動新增 20 題</button><button onclick="genAdd(50)" class="btn bg-purple-500 !py-2 !text-lg">🎁 自動新增 50 題</button><button onclick="clearBank()" class="btn bg-rose-500 !py-2 !text-lg">🧹 清空題庫</button></div>
    <div class="text-sm text-gray-600">更快的方法：回主畫面，把「題型」選成「♾️ 自動出題」，題目永遠出不完，完全不用補題。</div></div>
  <div class="grid gap-2 mb-3"><div class="font-black text-lg">📥 批次貼上（一行一題：題目|答案，也可寫成 題目|答案|選項|單元）</div>
    <textarea id="bulk" rows="4" placeholder="12 + 9 = ?|21&#10;小明有 8 顆糖，吃掉 3 顆，還剩幾顆？|5" class="border-4 border-indigo-200 rounded-2xl px-3 py-2 text-lg font-bold"></textarea>
    <div class="flex gap-2"><button onclick="bulkAdd(false)" class="btn bg-indigo-500 !py-2 !text-lg">➕ 加入題庫</button><button onclick="bulkAdd(true)" class="btn bg-amber-500 !py-2 !text-lg">♻️ 取代整個題庫</button></div></div>
  <div class="grid gap-2 mb-3"><div class="font-black text-lg">${editIdx>=0?'✏️ 修改第 '+(editIdx+1)+' 題（改好按「儲存修改」）':'✍️ 單題新增（可附圖片，題目文字可留空）'}</div><input id="nq" placeholder="題目，例如：12 + 9 = ?" class="border-4 border-indigo-200 rounded-2xl px-3 py-3 text-xl font-bold"><div class="flex flex-wrap gap-2"><select id="nt" class="rounded-2xl border-4 border-indigo-200 bg-white px-2 py-2 text-base font-bold"><option value="">（不分單元）</option>${UN.map(u=>`<option>${u}</option>`).join('')}</select><input id="nta" placeholder="活動名稱（選填，例如：活動2 加法直式計算）" class="flex-1 min-w-0 border-4 border-indigo-200 rounded-2xl px-3 py-2 text-base font-bold"></div>
    <div class="flex flex-wrap items-center gap-2"><label class="btn bg-teal-500 !py-2 !text-lg cursor-pointer">🖼️ 選圖片／拍照<input type="file" accept="image/*" class="hidden" onchange="pickImg(this)"></label><span class="text-sm text-gray-500">也可以先截圖，在這個視窗按 Ctrl+V 貼上</span></div><div id="imgPrev"></div>
    <input id="no" placeholder="選項（選填，用逗號隔開，例如：甲,乙,丙；留空會自動產生）" class="border-4 border-indigo-200 rounded-2xl px-3 py-3 text-lg font-bold">
    <div class="flex gap-2"><input id="na" placeholder="答案" class="flex-1 min-w-0 border-4 border-indigo-200 rounded-2xl px-3 py-3 text-xl font-bold"><button onclick="addQ()" class="btn bg-indigo-500 !py-2">${editIdx>=0?'💾 儲存修改':'➕ 新增'}</button>${editIdx>=0?'<button onclick="cancelEdit()" class="btn bg-gray-500 !py-2">取消</button>':''}</div></div><div class="space-y-1 mb-3">`;
  bank.forEach((q,i)=>{h+=`<div class="flex items-center gap-2 ${i===editIdx?'bg-amber-100 ring-2 ring-amber-400':'bg-indigo-50'} rounded-xl px-3 py-2"><span class="flex-1 font-bold cursor-pointer" onclick="editQ(${i})">${i+1}. ${q[4]?`<span class="text-xs font-bold text-indigo-600 mr-1">[${esc(q[4])}]</span>`:''}${q[2]?`<img src="${q[2]}" class="inline h-9 rounded border mr-1">`:''}${esc(q[0])} <span class="text-green-600">→ ${esc(q[1])}</span>${q[3]?`<span class="text-gray-500 text-sm">　選項：${esc(q[3])}</span>`:''}</span><button onclick="editQ(${i})" class="px-3 py-1 rounded-xl bg-amber-100 font-bold">✏️ 修改</button><button onclick="delQ(${i})" class="px-3 py-1 rounded-xl bg-rose-100 font-bold">🗑️</button></div>`});
  h+=`</div><div class="flex gap-2 justify-between"><button onclick="resetBank()" class="btn bg-gray-500 !py-2 !text-lg">還原預設題庫</button><button onclick="closeM()" class="btn bg-sky-500 !py-2 !text-lg">完成</button></div>`;
  openM(h);
  if(editIdx>=0&&bank[editIdx]){const q=bank[editIdx];$('nq').value=(q[2]&&q[0]==='請看圖回答')?'':q[0];$('na').value=q[1]||'';$('no').value=q[3]||'';const tg=String(q[4]||''),u0=UN.find(x=>tg.startsWith(x))||'';$('nt').value=u0;$('nta').value=u0?tg.slice(u0.length).trim():tg}
  showPrev();
}
function editQ(i){editIdx=i;pendingImg=bank[i][2]||null;openBank();$('mbox').scrollTop=0;sfx('click')}
function cancelEdit(){editIdx=-1;pendingImg=null;sfx('click');openBank()}
function bulkAdd(r){
  const L=($('bulk').value||'').split(/\r?\n/).map(l=>l.split(/[|｜\t]/)).filter(p=>p[0].trim()).map(p=>[p[0].trim(),(p[1]||'').trim(),'',(p[2]||'').trim(),(p[3]||'').trim()]);
  if(!L.length)return toast('請先貼上題目（一行一題）',false);
  const go=()=>{bank=r?L:bank.concat(L);saveBank();sfx('ok');openBank();toast(`已${r?'取代為':'加入'} ${L.length} 題 ✅`,false)};
  if(r)ask('會清掉目前所有題目，確定嗎？',go);else go();
}
function genAdd(k){for(let i=0;i<k;i++)bank.push(GEN[P(MIX)]());saveBank();sfx('ok');openBank();toast(`已自動新增 ${k} 題 🎁`,false)}
function clearBank(){ask('確定清空全部題目嗎？',()=>{bank=[];saveBank();openBank()})}
let pendingImg=null,editIdx=-1;
function fileToImg(f){return new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.75))};
    im.onerror=rej;im.src=r.result};
  r.onerror=rej;r.readAsDataURL(f)})}
function showPrev(){const e=$('imgPrev');if(e)e.innerHTML=pendingImg?`<div class="flex items-center gap-3"><img src="${pendingImg}" class="h-24 rounded-xl border-2 border-indigo-200"><button onclick="pendingImg=null;showPrev()" class="px-3 py-1 rounded-xl bg-rose-100 font-bold">✖ 移除圖片</button></div>`:''}
function pickImg(inp){const f=inp.files&&inp.files[0];if(!f)return;fileToImg(f).then(d=>{pendingImg=d;showPrev();sfx('ok')}).catch(()=>toast('圖片讀取失敗，請換一張試試',false))}
document.addEventListener('paste',e=>{
  if(!$('imgPrev'))return;
  const it=[...((e.clipboardData&&e.clipboardData.items)||[])].find(i=>i.type.startsWith('image/'));
  if(!it)return;e.preventDefault();
  fileToImg(it.getAsFile()).then(d=>{pendingImg=d;showPrev();sfx('ok');toast('已貼上圖片 ✅',false)}).catch(()=>{});
});
function bigImg(){
  if(!cur||!cur[2])return;
  openM(`<img src="${cur[2]}" class="max-w-full max-h-[82vh] mx-auto"><div class="text-center mt-3"><button onclick="closeM()" class="btn bg-sky-500 !py-2 !text-lg">關閉</button></div>`);
  $('mbox').classList.add('!max-w-[95vw]');
}
function addQ(){
  const q=$('nq').value.trim(),a=$('na').value.trim(),o=$('no').value.trim();
  if(!q&&!pendingImg)return toast('請輸入題目文字，或選擇圖片',false);
  const tg0=$('nt').value,ta0=$('nta').value.trim(),tag=tg0?(tg0+(ta0?' '+ta0:'')):ta0;
  const item=fixItem([q||'請看圖回答',a,pendingImg||'',o,tag]);
  if(editIdx>=0&&bank[editIdx]){bank[editIdx]=item;toast('已儲存修改 ✅',false)}else bank.push(item);
  editIdx=-1;pendingImg=null;saveBank();sfx('ok');openBank();
}
function delQ(i){bank.splice(i,1);if(editIdx===i){editIdx=-1;pendingImg=null}else if(editIdx>i)editIdx--;saveBank();sfx('click');openBank()}
function resetBank(){ask('要還原成預設題庫嗎？',()=>{bank=DEF.map(x=>x.slice());saveBank();openBank()})}
function openPick(){
  sfx('click');
  openM(`<div class="text-3xl font-black mb-3">📋 選擇題目</div><div class="grid gap-2">${bank.map((q,i)=>`<button onclick="closeM();showQ(${i})" class="text-left bg-purple-50 hover:bg-purple-100 rounded-2xl px-4 py-3 text-lg font-bold">${i+1}. ${q[2]?'🖼️ ':''}${esc(q[0])}</button>`).join('')}</div><div class="text-center mt-3"><button onclick="closeM()" class="btn bg-gray-500 !py-2 !text-lg">取消</button></div>`);
}

initGame();
fillVoices();if(window.speechSynthesis)speechSynthesis.onvoiceschanged=fillVoices;
try{const m=JSON.parse(localStorage.getItem('mtc_music')||'null');if(m){mu.mode=m.mode||'off';if(typeof m.vol==='number')mVol=m.vol}}catch(e){}
$('mSel').value=mu.mode;$('mVol').value=Math.round(mVol*100);
document.addEventListener('click',()=>{if(mu.mode!=='off'&&!mu.timer&&!over)musicStart()},{once:true});
openSetup(true);
</script>
</body>
</html>
