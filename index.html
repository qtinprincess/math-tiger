@keyframes pop{0%{transform:scale(.4) rotate(-12deg)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

<script>
const AV=['🐥','👦','👧','🐰','🐼','🐱','🐸','🦁','🦊','🐨','🦄','🐯','🐷'];let END=15,len=25,bonus=2;
const DEF=[["15 + 8 = ?","23"],["27 + 36 = ?","63"],["45 + 19 = ?","64"],["38 + 24 = ?","62"],["50 - 17 = ?","33"],["72 - 28 = ?","44"],["91 - 35 = ?","56"],["100 - 64 = ?","36"],["小明有 18 顆糖，媽媽又給他 15 顆，現在共有幾顆？","33"],["書包裡有 42 枝筆，送給同學 19 枝，還剩幾枝？","23"],["樹上有 26 隻鳥，飛走 9 隻，還剩幾隻？","17"],["哥哥有 35 元，弟弟有 28 元，兩人共有多少元？","63"],["哪個比較大？ 78 和 87","87"],["哪個比較小？ 56 和 65","56"],["在 □ 填入 > 、< 或 =：49 □ 94","<"],["3 + 3 + 3 = ?（幾個 3 相加？）","9"],["2 × 4 = ?（4 個 2 相加）","8"],["5 × 3 = ?（3 個 5 相加）","15"],["每盤有 4 顆蘋果，3 盤共有幾顆？","12"],["每人分 2 塊餅乾，5 個人共需要幾塊？","10"]];
let bank=DEF.map(x=>x.slice()),S=[],tiger=0,wrong=0,cur=null,showA=false,sound=true,speak=true,over=false,sel=new Set(),n=6;
let D=Array.from({length:8},(_,i)=>({name:'小朋友'+(i+1),av:AV[i]}));
try{const b=JSON.parse(localStorage.getItem('mtc_bank')||'null');if(Array.isArray(b)&&b.length)bank=b}catch(e){}
try{const d=JSON.parse(localStorage.getItem('mtc_d')||'null');if(d&&Array.isArray(d.D)&&d.D.length===8){D=d.D;n=d.n;if([15,25,35,45].includes(d.len))len=d.len;if([0,1,2].includes(d.bonus))bonus=d.bonus}}catch(e){}
const fixItem=q=>{const m=String(q[0]).split(/[|｜]/);if(m.length>=2&&!q[1]){q[0]=m[0].trim();q[1]=m[1].trim();if(m[2]&&!q[3])q[3]=m[2].trim()}return q};
bank=bank.map(fixItem);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saveBank=()=>{pool=[];try{localStorage.setItem('mtc_bank',JSON.stringify(bank))}catch(e){toast('⚠️ 儲存空間不足：圖片題這次可以用，但重新整理後可能會消失，請刪掉一些圖片題',false)}};

/* ---------- 音效 (Web Audio) ---------- */
let ac;
function tone(f,d=.15,t='sine',at=0,v=.2,f2){
  if(!sound)return;
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+at;
    o.type=t;o.frequency.setValueAtTime(f,s);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);
    g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);
    o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d+.02);
  }catch(e){}
}
function noise(d=.3,at=0,v=.2,f=1000,type='lowpass'){
  if(!sound)return;
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const n=Math.floor(ac.sampleRate*d),buf=ac.createBuffer(1,n,ac.sampleRate),a=buf.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
    const src=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain(),t=ac.currentTime+at;
    src.buffer=buf;fl.type=type;fl.frequency.value=f;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    src.connect(fl);fl.connect(g);g.connect(ac.destination);src.start(t);
  }catch(e){}
}
const SFX={
  click:()=>tone(660,.08,'triangle'),
  ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'sine',i*.09)),
  hard:()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.22,'triangle',i*.07)),
  bad:()=>{tone(220,.25,'square',0,.08,150);tone(185,.3,'square',.22,.08,120)},
  growl:()=>{tone(110,.7,'sawtooth',0,.22,55);tone(80,.7,'square',.05,.1,45)},
  hurt:()=>tone(520,.4,'sawtooth',0,.18,110),
  shield:()=>[1200,1600,2000].forEach((f,i)=>tone(f,.18,'sine',i*.07,.15)),
  buzz:()=>{tone(900,.1,'square',0,.12);tone(1200,.2,'square',.12,.12)},
  danger:()=>[0,.24,.48].forEach(t=>{tone(660,.22,'square',t,.1,900);tone(900,.22,'square',t+.12,.08,660)}),
  roar:()=>{tone(90,.8,'sawtooth',0,.3,40);tone(140,.7,'square',.05,.14,60);tone(60,.9,'sawtooth',.1,.25,30)},
  scream:()=>{tone(1500,.6,'sawtooth',0,.1,600);tone(1900,.5,'triangle',.05,.08,800);tone(1300,.4,'sawtooth',.3,.08,500)},
  thump:()=>{tone(70,.18,'sine',0,.4,40);tone(70,.18,'sine',.26,.4,40)},
  boom:()=>{tone(90,.5,'sine',0,.4,35);noise(.5,0,.3,700,'lowpass')},
  crackle:()=>{for(let i=0;i<10;i++)noise(.05,.12+i*.06+Math.random()*.05,.1,4000,'highpass')},
  applause:()=>{for(let i=0;i<34;i++)noise(.08,i*.09+Math.random()*.05,.09,2500+Math.random()*2000,'bandpass')},
  drum:()=>{for(let i=0;i<13;i++)noise(.06,i*.07,.1+i*.012,350,'lowpass')},
  lose:()=>{SFX.roar();noise(.7,0,.25,300,'lowpass');noise(1.2,.9,.07,500,'bandpass');[[392,.8],[370,1.25],[349,1.7]].forEach(([f,t])=>{tone(f,.4,'sawtooth',t,.12);tone(f*1.005,.4,'square',t,.05)});tone(330,1.4,'sawtooth',2.2,.14,180);tone(60,.6,'sine',3.5,.3,30)},
  win:()=>{SFX.drum();setTimeout(()=>{[523,523,523,659,784,659,784,1047].forEach((f,i)=>{tone(f,.28,'triangle',i*.14,.14);tone(f/2,.28,'sawtooth',i*.14,.05)});[1047,1319,1568,2093].forEach((f,i)=>tone(f,.3,'sine',1.3+i*.12,.12));SFX.applause()},900)}
};
const sfx=k=>SFX[k]&&SFX[k]();

/* ---------- 語音 (zh-TW) ---------- */
const rd=t=>String(t).replace(/[\uE000\uE001]/g,'').replace(/\+/g,' 加 ').replace(/[-−]/g,' 減 ').replace(/×/g,' 乘以 ').replace(/=/g,' 等於 ').replace(/>/g,' 大於 ').replace(/</g,' 小於 ').replace(/□/g,'框框').replace(/[?？]/g,' 多少 ');
function say(t){
  if(!speak||!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const v=getVoice();
    speakFix(String(t)).replace(/[\u{1F000}-\u{1FFFF}\u{2190}-\u{2BFF}\u{FE00}-\u{FE0F}\u200D]/gu,'').replace(/[（）()「」『』【】《》~～*＊#]/g,' ').split(/[。\n]/).forEach(seg=>{
      const pn=seg.includes('‼');
      seg.replace(/‼/g,'').split(/[！!；;]/).map(x=>x.trim()).filter(Boolean).forEach(x=>{
        const u=new SpeechSynthesisUtterance(x);u.lang='zh-TW';if(v)u.voice=v;u.rate=pn?1.12:.93;u.pitch=pn?1.45:1.08;speechSynthesis.speak(u);
      });
    });
  }catch(e){}
}
function speakFix(t){S.forEach(s=>{if(s.say&&s.name&&s.say!==s.name)t=t.split(s.name).join(s.say)});return t}
let vName='';try{vName=localStorage.getItem('mtc_voice')||''}catch(e){}
function getVoice(){
  const all=speechSynthesis.getVoices(),zs=all.filter(v=>/^zh/i.test(v.lang));
  if(vName){const m=all.find(v=>v.name===vName);if(m)return m}
  const sc=v=>(/zh[-_]TW|zh[-_]Hant/i.test(v.lang)?10:0)+(/Natural|Online|Neural/i.test(v.name)?6:0)+(/Premium|Enhanced|進階|優質/i.test(v.name)?4:0)+(/HsiaoChen|曉臻|Meijia|Mei-Jia|美佳/i.test(v.name)?3:0)+(/Google/i.test(v.name)?2:0);
  return zs.sort((a,b)=>sc(b)-sc(a))[0]||null;
}
function fillVoices(){
  const sel=$('vSel');if(!sel||!window.speechSynthesis)return;
  const zs=speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang));
  sel.innerHTML='<option value="">🎙️ 自動挑選最自然的聲音</option>'+zs.map(v=>`<option value="${esc(v.name)}" ${v.name===vName?'selected':''}>${esc(v.name)}</option>`).join('');
}
function setVoice(v){vName=v;try{localStorage.setItem('mtc_voice',v)}catch(e){}say('哈囉，我是數學老虎，我們一起來練習吧！')}

const WARN=['小心！老虎追上來了！','快跑快跑！老虎就在後面！','糟糕，老虎越來越近了！','注意注意！老虎正在靠近！','哇，老虎的腳步聲來了！'];
const HIT=['啊啊啊！老虎抓到你了！','救命啊！老虎撲過來了！','哇！好可怕！快逃啊！','糟糕！被老虎追到了！','嚇死寶寶了！老虎衝過來！'];
const SAFE=['好險！護盾擋住了老虎！','哇，好險好險！護盾救了你！','叮！護盾把老虎彈開了！'];
function alarmFx(){const a=$('app'),f=$('flash');a.classList.remove('shake');f.classList.remove('on');void a.offsetWidth;a.classList.add('shake');f.classList.add('on')}
function tigerAdvance(msgs){
  tiger=Math.min(END,tiger+1);
  let hit=false,safe=false;
  S.forEach(s=>{
    if(s.pos===tiger&&s.pos<END){
      if(s.shields>0){s.shields--;safe=true;msgs.push(`${s.av}${s.name} ${nxt('safe',SAFE)} 🛡️`)}
      else{s.pos=Math.max(1,s.pos-1);hit=true;msgs.push(`‼${nxt('hit',HIT)} ${s.av}${s.name} 退後 1 步 😱`)}
    }
  });
  if(!hit&&!safe)msgs.push(`‼🐯 ${nxt('warn',WARN)}`);
  sfx('danger');setTimeout(()=>sfx('growl'),300);
  if(hit){setTimeout(()=>sfx('roar'),500);setTimeout(()=>sfx('scream'),800);alarmFx()}
  else if(safe)setTimeout(()=>sfx('shield'),700);
  else setTimeout(()=>sfx('thump'),700);
}
function answer(kind){
  if(over)return toast('遊戲已結束，請按「🔄 重新開始」或「↩️ 返回上一步」');
  const P=S.filter((_,i)=>sel.has(i));
  if(!P.length){sfx('bad');return toast('請先勾選答題的小朋友 ☝️')}
  snap();judged=true;stopTimer();
  const msgs=[],wasTurn=P.length===1&&S.indexOf(P[0])===turn;
  if(kind==='bad'){
    sfx('bad');
    P.forEach(s=>s.streak=0);
    wrong++;
    msgs.push(`${cheer('bad',P)} 💪（${P.map(s=>s.name).join('、')}）`);
    if(wrong%2===0)setTimeout(()=>{},0),tigerAdvance(msgs);
  }else{
    let hurt=false,sh=false;
    P.forEach(s=>{
      const old=s.pos;let step=kind==='hard'?2:1;
      s.stars++;s.streak++;
      if(s.streak%3===0){s.shields++;sh=true;msgs.push(`${s.av}${s.name} 連對 3 題，獲得護盾🛡️`)}
      if(bonus>0&&s.stars%5===0){step+=bonus;msgs.push(`${s.av}${s.name} 集滿 5 顆星，加速前進 ${bonus} 步！🌟`)}
      s.pos=Math.min(END,s.pos+step);
      if(tiger>0&&old<=tiger&&s.pos>=tiger)hurt=true;
    });
    msgs.unshift(kind==='hard'?`${cheer('hard',P)} ${P.map(s=>s.name).join('、')} 前進 2 步 🌟`:`${cheer('ok',P)} ${P.map(s=>s.name).join('、')} 前進 1 步 ✅`);
    sfx(kind==='hard'?'hard':'ok');
    if(sh)setTimeout(()=>sfx('shield'),700);
    if(hurt){tiger=Math.max(0,tiger-1);msgs.push('‼🐯 嗷嗚！好痛！老虎被追上，退後 1 步～');setTimeout(()=>sfx('hurt'),900)}
  }
  if(rot&&wasTurn){
    turnN++;
    if(kind!=='bad'&&turnN<2)msgs.push(`${S[turn].av}${S[turn].name} 答對了，再答一題，加油！`);
    else{turn=(turn+1)%S.length;turnN=0;msgs.push(`換 ${S[turn].av}${S[turn].name} 囉！`)}
  }
  sel.clear();if(rot)sel.add(turn);render();
  const w=S.filter(s=>s.pos>=END);
  if(w.length){over=true;render();setTimeout(()=>win(w),1400);return}
  if(tiger>=END){over=true;render();setTimeout(lose,1800);return}
  toast(msgs.join('\n'),msgs.join('。'));
  $('toast').style.whiteSpace='pre-line';
}
function buzzer(){
  if(!S.length)return;
  const i=Math.floor(Math.random()*S.length);
  sel=new Set([i]);sfx('buzz');render();
  toast(`⚡ ${S[i].av} ${S[i].name} 搶到答題權！`,`${S[i].name} 搶到答題權`);
  $('toast').style.whiteSpace='normal';
}
function fireworks(ms){
  const cv=document.createElement('canvas');
  cv.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;z-index:65;pointer-events:none';
  cv.id='fwc';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);
  const x=cv.getContext('2d'),cols=['#ff4d4d','#ffd43b','#51cf66','#339af0','#f06595','#ff922b','#cc5de8'],end=Date.now()+ms;
  let ps=[],rk=[],last=0;
  function launch(){
    rk.push({x:cv.width*(.12+Math.random()*.76),y:cv.height,vy:-cv.height*(.011+Math.random()*.004),ty:cv.height*(.15+Math.random()*.3),c:cols[Math.floor(Math.random()*cols.length)]});
    tone(500,.5,'sine',0,.05,1500);
  }
  function boom(r){
    for(let i=0;i<70;i++){const a=Math.PI*2*i/70,sp=2+Math.random()*5;ps.push({x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,c:Math.random()<.3?'#ffffff':r.c})}
    SFX.boom();SFX.crackle();
  }
  function frame(t){
    if(Date.now()>end&&!ps.length&&!rk.length){cv.remove();return}
    x.clearRect(0,0,cv.width,cv.height);
    if(Date.now()<end&&t-last>420){launch();last=t}
    rk.forEach(r=>{r.y+=r.vy;x.fillStyle=r.c;x.beginPath();x.arc(r.x,r.y,3,0,7);x.fill();if(r.y<=r.ty){r.dead=1;boom(r)}});
    rk=rk.filter(r=>!r.dead);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.l-=.012;x.globalAlpha=Math.max(p.l,0);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,2.8,0,7);x.fill()});
    x.globalAlpha=1;ps=ps.filter(p=>p.l>0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

}

function fileToImg(f){return new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.75))};
    im.onerror=rej;im.src=r.result};
  r.onerror=rej;r.readAsDataURL(f)})}
function showPrev(){const e=$('imgPrev');if(e)e.innerHTML=pendingImg?`<div class="flex items-center gap-3"><img src="${pendingImg}" class="h-24 rounded-xl border-2 border-indigo-200"><button onclick="pendingImg=null;showPrev()" class="px-3 py-1 rounded-xl bg-rose-100 font-bold">✖ 移除圖片</button></div>`:''}
function pickImg(inp){const f=inp.files&&inp.files[0];if(!f)return;fileToImg(f).then(d=>{pendingImg=d;showPrev();sfx('ok')}).catch(()=>toast('圖片讀取失敗，請換一張試試',false))}
document.addEventListener('paste',e=>{
  if(!$('imgPrev'))return;
  const it=[...((e.clipboardData&&e.clipboardData.items)||[])].find(i=>i.type.startsWith('image/'));
  if(!it)return;e.preventDefault();
  fileToImg(it.getAsFile()).then(d=>{pendingImg=d;showPrev();sfx('ok');toast('已貼上圖片 ✅',false)}).catch(()=>{});
});
function bigImg(){
  if(!cur||!cur[2])return;
  openM(`<img src="${cur[2]}" class="max-w-full max-h-[82vh] mx-auto"><div class="text-center mt-3"><button onclick="closeM()" class="btn bg-sky-500 !py-2 !text-lg">關閉</button></div>`);
  $('mbox').classList.add('!max-w-[95vw]');
}
function addQ(){
  const q=$('nq').value.trim(),a=$('na').value.trim(),o=$('no').value.trim();
  if(!q&&!pendingImg)return toast('請輸入題目文字，或選擇圖片',false);
  const item=fixItem([q||'請看圖回答',a,pendingImg||'',o]);
  if(editIdx>=0&&bank[editIdx]){bank[editIdx]=item;toast('已儲存修改 ✅',false)}else bank.push(item);
  editIdx=-1;pendingImg=null;saveBank();sfx('ok');openBank();
}
function delQ(i){bank.splice(i,1);if(editIdx===i){editIdx=-1;pendingImg=null}else if(editIdx>i)editIdx--;saveBank();sfx('click');openBank()}
function resetBank(){ask('要還原成預設題庫嗎？',()=>{bank=DEF.map(x=>x.slice());saveBank();openBank()})}
function openPick(){
  sfx('click');
  openM(`<div class="text-3xl font-black mb-3">📋 選擇題目</div><div class="grid gap-2">${bank.map((q,i)=>`<button onclick="closeM();showQ(${i})" class="text-left bg-purple-50 hover:bg-purple-100 rounded-2xl px-4 py-3 text-lg font-bold">${i+1}. ${q[2]?'🖼️ ':''}${esc(q[0])}</button>`).join('')}</div><div class="text-center mt-3"><button onclick="closeM()" class="btn bg-gray-500 !py-2 !text-lg">取消</button></div>`);
}

initGame();
fillVoices();if(window.speechSynthesis)speechSynthesis.onvoiceschanged=fillVoices;
openSetup(true);
</script>
